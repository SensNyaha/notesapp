name: Deploy NotesApp

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: notesapp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create .env
        shell: bash
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
        run: |
          set -euo pipefail
          umask 077

          : > .env

          while IFS= read -r line || [ -n "$line" ]; do

            if [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]]; then
              printf '%s\n' "$line" >> .env
              continue
            fi

            if [[ "$line" != *"="* ]]; then
              printf '%s\n' "$line" >> .env
              continue
            fi

            key="${line%%=*}"
            default_value="${line#*=}"
            key="$(printf '%s' "$key" | xargs)"

            secret_value="$(
              jq -r --arg key "$key" '
                if has($key) then .[$key] else empty end
              ' <<< "$ALL_SECRETS"
            )"

            if [[ -n "$secret_value" ]]; then
              printf '%s=%s\n' "$key" "$secret_value" >> .env
            else
              printf '%s=%s\n' "$key" "$default_value" >> .env
            fi

          done < .env.example

          chmod 600 .env

      - name: Build
        run: docker compose build --pull

      - name: Deploy
        run: docker compose up -d --remove-orphans

      - name: Status
        run: docker compose ps

      - name: Remove .env
        if: always()
        run: rm -f .env

      - name: Cleanup
        if: success()
        run: docker image prune -f
