name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build containers
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Cleanup old images
        run: docker image prune -f
