name: tasks-local
services:
  app:
    build:
      context: .
      network: host
    image: tasks:0.20.8
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3100}
      AUTH_COOKIE_MODE: ${AUTH_COOKIE_MODE:-localhost}
      BOOTSTRAP_ADMIN_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  data:
